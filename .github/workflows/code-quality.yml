name: Code Quality

on:
    workflow_call:  # you can call this workflow before/after any other workflow

jobs:
    sast:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7
            
            - name: Setup NodeJs
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                cache: npm
#                cache-dependency-path: frontend/package-lock.json
            
            - name: Install npm Packages
              run: npm install --legacy-peer-deps

            - name: Run Linter
              run: npm run lint
              