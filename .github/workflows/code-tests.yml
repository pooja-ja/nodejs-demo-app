name: Code Tests

on: 
    workflow_call:

jobs:
    test:
        # Github runner
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup NodeJs
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                cache: npm

            - name: Install Dependencies
              run: npm ci

            - name: Run Tests
              continue-on-error: true
              run: npm run test
              working-directory: ./tests